<div class="phone-container">
  <div class="content">
    <h1>Currículos</h1>
    <p class="subtitle">Versões que você já usou nas candidaturas</p>

    <!-- Input de arquivo oculto (aceita apenas PDF) -->
    <input
      type="file"
      #fileInput
      accept="application/pdf"
      style="display: none"
      (change)="onFileSelected($event)"
    />

    <!-- Botão principal da página para adicionar nova versão de currículo -->
    <button class="btn-add" (click)="fileInput.click()">
      + Adicionar nova versão (PDF)
    </button>

    <!-- Lista dinâmica vinda do backend -->
    <div class="lista-curriculos">
      <div *ngFor="let curr of curriculos" class="card">
        <!-- Usa exclusivamente o displayName que já removeu a palavra "Versão" no código -->
        <div class="card-header" style="font-weight: bold; font-size: 15px; color: #111827; margin-bottom: 8px;">
          {{ curr.displayName }}
        </div>

        <div class="card-footer" style="border-top: 1px solid #f3f4f6; padding-top: 8px; display: flex; justify-content: space-between; font-size: 12px; color: #6b7280;">
          <span>Adicionado recentemente</span>
          <span style="font-weight: 600; color: #059669;">{{ curr.usageCount }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Menu de navegação inferior -->
  <nav class="bottom-nav">
    <a routerLink="/candidaturas" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
      Candidaturas
    </a>
    <a routerLink="/nova" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Nova
    </a>
    <a routerLink="/curriculums" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      Currículos
    </a>
  </nav>
</div>
